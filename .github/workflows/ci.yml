name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run openapi:check

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker buildx build --platform linux/amd64 --load --tag animals-be:ci .
